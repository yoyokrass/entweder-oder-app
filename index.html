<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Das oder Das</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="icons/apple-touch-icon.png">
</head>

<body>

    <!-- =========================
         STARTSEITE
         ========================= -->

    <div id="homeScreen">

        <header class="topbar">

            <img
                class="home-logo"
                src="design/logo.png"
                alt="Das oder Das"
            >

            <button
                id="addThemeButton"
                type="button">
                ＋ Neues Thema
            </button>

            <input
                type="file"
                id="folderInput"
                webkitdirectory
                multiple
                hidden
            >

        </header>


        <main
            class="theme-grid"
            id="themeGrid">
        </main>

    </div>


    <!-- =========================
         SPIELANSICHT
         ========================= -->

    <section id="gameScreen">


        <!-- OBERES BILD -->

        <div class="game-image top-image">

            <img
                id="topGameImage"
                src=""
                alt=""
            >

            <button
                class="info-button"
                id="topInfoButton"
                type="button"
                aria-label="Bildinformation anzeigen">
                i
            </button>

            <div
                class="image-info"
                id="topImageInfo">
            </div>

        </div>


        <!-- MITTLERE LEISTE -->

        <div class="game-bar">

            <div class="bar-background"></div>

            <button
                id="menuButton"
                type="button"
                aria-label="Hauptmenü">
                ☰
            </button>

            <img
                id="gameLogo"
                src="design/logo.png"
                alt="Das oder Das"
            >

        </div>


        <!-- UNTERES BILD -->

        <div class="game-image bottom-image">

            <img
                id="bottomGameImage"
                src=""
                alt=""
            >

            <button
                class="info-button"
                id="bottomInfoButton"
                type="button"
                aria-label="Bildinformation anzeigen">
                i
            </button>

            <div
                class="image-info"
                id="bottomImageInfo">
            </div>

        </div>

    </section>


    <script src="app.js"></script>

</body>

</html>
