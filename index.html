<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Das oder Das</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="icons/apple-touch-icon.png">
</head>

<body>


    <!-- =====================================
         HAUPTMENÜ
         ===================================== -->

    <section id="mainMenu">

        <img
            class="main-logo"
            src="design/logo.png"
            alt="Das oder Das"
        >

        <div class="main-menu-buttons">

            <button
                id="normalModeButton"
                class="main-menu-button"
                type="button">
                Das oder Das
            </button>

            <button
                id="eliminationModeButton"
                class="main-menu-button"
                type="button">
                Elimination
            </button>

            <button
                id="manageThemesButton"
                class="main-menu-button secondary-button"
                type="button">
                Themen verwalten
            </button>

        </div>

    </section>



    <!-- =====================================
         THEMENAUSWAHL
         ===================================== -->

    <section id="themeSelection">

        <header class="selection-header">

            <button
                id="selectionBackButton"
                class="back-button"
                type="button"
                aria-label="Zurück">
                ←
            </button>

            <h1 id="selectionTitle">
                Thema wählen
            </h1>

        </header>

        <main
            class="theme-grid"
            id="themeGrid">
        </main>

    </section>



    <!-- =====================================
         THEMEN VERWALTEN
         ===================================== -->

    <section id="themeManagement">

        <header class="selection-header">

            <button
                id="managementBackButton"
                class="back-button"
                type="button"
                aria-label="Zurück">
                ←
            </button>

            <h1>
                Themen verwalten
            </h1>

        </header>

        <div class="add-theme-area">

            <button
                id="addThemeButton"
                type="button">
                ＋ Neues Thema
            </button>

            <input
                type="file"
                id="folderInput"
                webkitdirectory
                multiple
                hidden
            >

        </div>

        <main
            class="theme-grid"
            id="managementThemeGrid">
        </main>

    </section>



    <!-- =====================================
         SPIEL
         ===================================== -->

    <section id="gameScreen">

        <!-- OBERES / LINKES BILD -->

        <div class="game-image top-image">

            <img
                id="topGameImage"
                src=""
                alt=""
            >

            <button
                class="info-button"
                id="topInfoButton"
                type="button"
                aria-label="Bildinformation anzeigen">
                i
            </button>

            <div
                class="image-info"
                id="topImageInfo">
            </div>

        </div>


        <!-- MITTELLEISTE -->

        <div class="game-bar">

            <div class="bar-background"></div>

            <button
                id="menuButton"
                type="button"
                aria-label="Menü">
                ☰
            </button>

            <img
                id="gameLogo"
                src="design/logo.png"
                alt="Das oder Das"
            >

        </div>


        <!-- UNTERES / RECHTES BILD -->

        <div class="game-image bottom-image">

            <img
                id="bottomGameImage"
                src=""
                alt=""
            >

            <button
                class="info-button"
                id="bottomInfoButton"
                type="button"
                aria-label="Bildinformation anzeigen">
                i
            </button>

            <div
                class="image-info"
                id="bottomImageInfo">
            </div>

        </div>

    </section>



    <!-- =====================================
         ELIMINATION – GEWINNER
         ===================================== -->

    <section id="winnerScreen">

        <button
            id="winnerBackButton"
            class="winner-back-button"
            type="button"
            aria-label="Zurück">
            ←
        </button>

        <h1 class="winner-title">
            Gewinner
        </h1>

        <div class="winner-image-frame">

            <img
                id="winnerImage"
                src=""
                alt="Gewinner"
            >

        </div>

        <div
            id="winnerName"
            class="winner-name">
        </div>

        <div class="winner-buttons">

            <button
                id="playAgainButton"
                class="winner-button"
                type="button">
                Nochmal spielen
            </button>

            <button
                id="winnerThemesButton"
                class="winner-button secondary-winner-button"
                type="button">
                Zur Themenauswahl
            </button>

        </div>

    </section>



    <script src="app.js"></script>

</body>

</html>
